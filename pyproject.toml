[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-atelier"
version = "1.0.0"
description = "An AI-powered tool for creating complete graphic designs from natural-language requests"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1,<2",
    "Pillow>=10,<13",
    "openai>=2,<3",
    "jsonschema>=4,<5",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "streamlit>=1.40,<2",
]

[project.scripts]
corpus-atelier = "corpus_atelier.cli:main"

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.setuptools.package-dir]
"" = "src"
[tool.setuptools.package-data]
corpus_atelier = ["skills/**/*.md", "schemas/*.json"]
