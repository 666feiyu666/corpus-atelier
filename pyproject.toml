[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-atelier"
version = "1.2.0"
description = "An AI-powered tool for creating complete graphic designs from natural-language requests"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1,<2",
    "Pillow>=10,<13",
    "openai>=2,<3",
    "jsonschema>=4,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]

[project.scripts]
corpus-atelier = "corpus_atelier.cli:main"

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.setuptools.package-dir]
"" = "src"
[tool.setuptools.package-data]
corpus_atelier = ["schemas/*.json", "corpus/seed/*.json"]
