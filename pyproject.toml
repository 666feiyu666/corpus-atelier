[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-atelier"
version = "0.2.0"
description = "Agentic, corpus-grounded graphic-design experiments"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1,<2",
    "Pillow>=10,<13",
    "openai>=2,<3",
    "jsonschema>=4,<5",
    "langgraph>=1,<2",
]

[project.scripts]
corpus-atelier = "corpus_atelier.cli:main"

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.setuptools.package-dir]
"" = "src"
[tool.setuptools.package-data]
corpus_atelier = ["prompts/**/*.md", "schemas/*.json"]
