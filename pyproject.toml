[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphic-design-helper"
version = "0.1.0"
description = "Recorded design-model and image-generation experiments"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1,<2",
    "Pillow>=10,<13",
    "openai>=2,<3",
    "jsonschema>=4,<5",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphic_design_helper = ["prompts/*.md", "prompts/*.json"]
